yaml
name: Build Android TV Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan Anda untuk menjalankan build secara manual dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      # Jika file gradlew belum ada di repo, langkah ini akan dilewati otomatis atau Anda bisa menggunakan gradle bawaan runner

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TropicalTVLauncher-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
